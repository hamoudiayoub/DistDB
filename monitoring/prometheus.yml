# Prometheus scrapes every DistDB node's /metrics (each node's --http port, 8080 in its container).
global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: pd
    static_configs:
      - targets:
          - pd1:8080
          - pd2:8080
          - pd3:8080
        labels:
          role: placement-driver
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: node

  - job_name: data
    static_configs:
      - targets:
          - n1:8080
          - n2:8080
          - n3:8080
          - n4:8080
          - n5:8080
        labels:
          role: data-node
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: node
